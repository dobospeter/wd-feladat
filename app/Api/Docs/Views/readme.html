<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Asset Register API - README</title>
    <style>
        :root { color-scheme: light dark; --fg: #1f2328; --bg: #fff; --muted: #656d76; --line: #d0d7de; --code: #f6f8fa; --link: #0969da; }
        @media (prefers-color-scheme: dark) {
            :root { --fg: #e6edf3; --bg: #0d1117; --muted: #8d96a0; --line: #30363d; --code: #161b22; --link: #4493f8; }
        }
        body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
        nav { border-bottom: 1px solid var(--line); padding: 12px 16px; font-size: 14px; }
        nav a { margin-right: 16px; }
        main { max-width: 920px; margin: 0 auto; padding: 24px 16px 64px; }
        a { color: var(--link); }
        h1, h2, h3 { line-height: 1.25; }
        h1, h2 { padding-bottom: .3em; border-bottom: 1px solid var(--line); }
        code { background: var(--code); padding: .15em .4em; border-radius: 6px; font-size: 85%; }
        pre { background: var(--code); padding: 16px; border-radius: 6px; overflow: auto; }
        pre code { background: none; padding: 0; font-size: 85%; }
        table { border-collapse: collapse; display: block; overflow-x: auto; max-width: 100%; }
        th, td { border: 1px solid var(--line); padding: 6px 13px; }
        tr:nth-child(2n) { background: var(--code); }
        blockquote { margin: 0; padding: 0 1em; color: var(--muted); border-left: .25em solid var(--line); }
    </style>
</head>
<body>
<nav><a href="/readme">README</a><a href="/docs">API documentation (login required)</a></nav>
<main>
{{ content }}
</main>
</body>
</html>
